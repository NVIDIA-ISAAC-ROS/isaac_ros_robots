/**:
  ros__parameters:
    pid_gains:
      position:
        # Leg joints - conservative gains to avoid instability
        left_hip_pitch_joint:
          p: 50.0
          i: 0.0
          d: 5.0

        left_hip_roll_joint:
          p: 50.0
          i: 0.0
          d: 5.0

        left_hip_yaw_joint:
          p: 50.0
          i: 0.0
          d: 5.0

        left_knee_joint:
          p: 50.0
          i: 0.0
          d: 5.0

        left_ankle_pitch_joint:
          p: 25.0
          i: 0.0
          d: 2.5

        left_ankle_roll_joint:
          p: 25.0
          i: 0.0
          d: 2.5

        right_hip_pitch_joint:
          p: 50.0
          i: 0.0
          d: 5.0

        right_hip_roll_joint:
          p: 50.0
          i: 0.0
          d: 5.0

        right_hip_yaw_joint:
          p: 50.0
          i: 0.0
          d: 5.0

        right_knee_joint:
          p: 50.0
          i: 0.0
          d: 5.0

        right_ankle_pitch_joint:
          p: 25.0
          i: 0.0
          d: 2.5

        right_ankle_roll_joint:
          p: 25.0
          i: 0.0
          d: 2.5


