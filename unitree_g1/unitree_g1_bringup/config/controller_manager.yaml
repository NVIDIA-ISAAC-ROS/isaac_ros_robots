# Upper Body Impedance Controller Configuration (arms, wrists, hands, waist).
# Chained with safety_controller. Controls upper body joints only.
# Per-joint kp/kd gains were hand-tuned for good performance with GR00T.
upper_body_forward_joint_command_controller:
  ros__parameters:
    joint_command_topic: ""
    joint_command_trajectory_topic: joint_commands_trajectory
    command_prefix: "safety_controller"
    command_suffix: "_raw"
    # Match the teleop app's gains: arms + waist_yaw use the cuMotion IK
    # controller's flat gains (kp=20, kd=1); fingers use the dedicated
    # fingers_forward_joint_command_controller's flat gains (kp=0.5, kd=0.1).
    kp:
      ".*": 20.0
      ".*_hand_.*_joint": 0.5
    kd:
      ".*": 1.0
      ".*_hand_.*_joint": 0.1
    # Deterministic hold-posture target: all upper-body joints default to 0 rad
    # when no JointCommandTrajectory has been received, so the pose is the same
    # regardless of when the controller activates relative to MuJoCo reset.
    default_position:
      ".*": 0.0
    joints:
      - waist_yaw_joint
      - left_shoulder_pitch_joint
      - right_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - right_shoulder_roll_joint
      - left_shoulder_yaw_joint
