# cuMotion IK Controller Configuration.
ik_controller:
  ros__parameters:
    left_end_effector_frame: left_hand_palm_link
    right_end_effector_frame: right_hand_palm_link
    left_ee_command_frame: "left_hand_palm_link_openxr"
    right_ee_command_frame: "right_hand_palm_link_openxr"
    robot_base_frame: pelvis
    # Arms-only (14 DOF): excludes all waist joints.  waist_roll and waist_pitch
    # are claimed by inference_controller in the agile_velocity_with_ik group.
    # waist_yaw is excluded so the IK controller produces zero torque on it.
    kp: 20.0
    kd: 1.0
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint

