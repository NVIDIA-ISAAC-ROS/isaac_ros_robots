# Safety Core Controller Configuration.
# Note: blend_ratio will be overridden by launch file (hardware-specific defaults).
safety_controller:
  ros__parameters:
    # Gravity compensation applied to these joints (upper body / arms); URDF injected by the launch file.
    gravity_compensation_joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
    gravity_compensation_mode: "overwrite"
    # Strategy and default gains
    blend_strategy: "interpolate"
    # Per-joint velocity clamp (regex allowlist; unmatched = unconstrained). Arms/hands limited to 1.2 rad/s.
    interpolate_max_velocity:
      ".*(shoulder|elbow|wrist|hand).*": 1.2
    kp:
      ".*": 100.0
    kd:
      ".*": 2.0

    # Blend ratio for safety blending (0.0 to 1.0)
    # 0.0 = policy disabled (zero output), 1.0 = policy fully enabled
    # Adjustable at runtime via: ros2 param set /safety_controller blend_ratio <value>
    # Or use rqt_reconfigure GUI for easier adjustment
    blend_ratio: 0.0  # Overridden by launch file: 1.0 for sim, 0.0 for real
    max_blend_ratio_speed: 1.0  # Max rate of change for blend_ratio (units/second)
    out_of_domain_detection:
      velocity_threshold:
        mean_velocity: 10.0
        max_velocity: 35.0
        excluded_joints:
          - "left_hand_.*"
          - "right_hand_.*"
      emergency_controller: "freeze_controller"
      switch_timeout: 2.0
    joints:
      - left_hip_pitch_joint
      - right_hip_pitch_joint
      - waist_yaw_joint
      - left_hip_roll_joint
      - right_hip_roll_joint
      - waist_roll_joint
      - left_hip_yaw_joint
      - right_hip_yaw_joint
      - waist_pitch_joint
      - left_knee_joint
      - right_knee_joint
      - left_shoulder_pitch_joint
      - right_shoulder_pitch_joint
      - left_ankle_pitch_joint
      - right_ankle_pitch_joint
      - left_shoulder_roll_joint
      - right_shoulder_roll_joint
      - left_ankle_roll_joint
      - right_ankle_roll_joint
      - left_shoulder_yaw_joint
      - right_shoulder_yaw_joint
      - left_elbow_joint
      - right_elbow_joint
      - left_wrist_roll_joint
      - right_wrist_roll_joint
      - left_wrist_pitch_joint
      - right_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_wrist_yaw_joint
      - left_hand_thumb_0_joint
      - left_hand_thumb_1_joint
      - left_hand_thumb_2_joint
      - left_hand_middle_0_joint
      - left_hand_middle_1_joint
      - left_hand_index_0_joint
      - left_hand_index_1_joint
      - right_hand_thumb_0_joint
      - right_hand_thumb_1_joint
      - right_hand_thumb_2_joint
      - right_hand_middle_0_joint
      - right_hand_middle_1_joint
      - right_hand_index_0_joint
      - right_hand_index_1_joint

# Split-blend pair. Each variant's blend_ratio is independently tunable; the
# launch file sets a split-blend default (upper_body=0) so legs come up first.
safety_controller_lower_body:
  ros__parameters:
    blend_strategy: "interpolate"
    kp:
      ".*": 100.0
    kd:
      ".*": 2.0
    blend_ratio: 0.0
    max_blend_ratio_speed: 1.0
    out_of_domain_detection:
      velocity_threshold:
        mean_velocity: 10.0
        max_velocity: 35.0
        excluded_joints:
          - "left_hand_.*"
          - "right_hand_.*"
      emergency_controller: "freeze_controller"
      switch_timeout: 2.0
    # 12 legs + waist roll + waist pitch. Matches the AGILE action output set.
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
      - waist_roll_joint
      - waist_pitch_joint

safety_controller_upper_body:
  ros__parameters:
    blend_strategy: "interpolate"
    # All joints here are homed by default_position, so clamp all of them (incl. waist_yaw)
    # to avoid a snap from the measured angle at blend_ratio=0 activation.
    interpolate_max_velocity:
      ".*": 0.75
    default_position:
      ".*": 0.0
      "right_shoulder_yaw_joint": -0.524
      "left_shoulder_yaw_joint": 0.524
      "left_elbow_joint": -0.349
    kp:
      ".*": 100.0
    kd:
      ".*": 2.0
    blend_ratio: 0.0
    max_blend_ratio_speed: 1.0
    out_of_domain_detection:
      velocity_threshold:
        mean_velocity: 10.0
        max_velocity: 35.0
        excluded_joints:
          - "left_hand_.*"
          - "right_hand_.*"
      emergency_controller: "freeze_controller"
      switch_timeout: 2.0
    # waist yaw + arms + hands (29). Disjoint from lower_body; union = 43 DoF.
    joints:
      - waist_yaw_joint
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
      - left_hand_thumb_0_joint
      - left_hand_thumb_1_joint
      - left_hand_thumb_2_joint
      - left_hand_middle_0_joint
      - left_hand_middle_1_joint
      - left_hand_index_0_joint
      - left_hand_index_1_joint
      - right_hand_thumb_0_joint
      - right_hand_thumb_1_joint
      - right_hand_thumb_2_joint
      - right_hand_middle_0_joint
      - right_hand_middle_1_joint
      - right_hand_index_0_joint
      - right_hand_index_1_joint

