controller_manager:
  ros__parameters:
    update_rate: 200  # Hz
    enable_pal_statistics_publisher: false  # Disable to prevent shutdown errors
    enable_pal_statistics: false  # Alternative parameter name

    # Controller type definitions.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    joint_command_broadcaster:
      type: isaac_ros_deploy_ros2_control/JointCommandBroadcaster

    disable_controller:
      type: isaac_ros_deploy_ros2_control/DisableController

    freeze_controller:
      type: isaac_ros_deploy_ros2_control/FreezeController

    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    forward_joint_command_controller:
      type: isaac_ros_deploy_ros2_control/ForwardJointCommandController

    fingers_forward_joint_command_controller:
      type: isaac_ros_deploy_ros2_control/ForwardJointCommandController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    inference_controller:
      type: isaac_ros_deploy_ros2_control/InferenceController

    upper_body_forward_joint_command_controller:
      type: isaac_ros_deploy_ros2_control/ForwardJointCommandController

    safety_controller:
      type: isaac_ros_deploy_ros2_control/SafetyController

    safety_controller_lower_body:
      type: isaac_ros_deploy_ros2_control/SafetyController

    safety_controller_upper_body:
      type: isaac_ros_deploy_ros2_control/SafetyController

    ik_controller:
      type: isaac_ros_cumotion_controllers/BimanualIkController

